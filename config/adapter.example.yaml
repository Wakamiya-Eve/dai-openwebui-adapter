# Example only. Do not reuse these URLs without checking the OpenWebUI connection.
schema_version: dai.openwebui-adapter.v1
source_id: n2830-dai
sources:
  m3:
    url: http://127.0.0.1:38197/v1
    api_key_env: M3_API_KEY
  gateway:
    url: http://127.0.0.1:8100/v1
    api_key_env: AGENT_GATEWAY_API_KEY
openwebui:
  url: http://127.0.0.1:13000
  api_key_env: OPENWEBUI_ADMIN_API_KEY
  connection_index: 0
  # Must match the provider URL stored in OpenWebUI, as seen from its container.
  # It can differ from sources.gateway.url (for example a Docker bridge proxy).
  expected_upstream_url: http://host.docker.internal:18100/v1
publication:
  workspace_prefix: dai.chat.
  profile: auto
state_dir: /srv/n2830-data/app-data/dai-openwebui-adapter
timeout_seconds: 30
allow_empty_catalogue: false
