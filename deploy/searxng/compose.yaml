services:
  searxng:
    image: ${SEARXNG_IMAGE:?Set a reviewed immutable SearXNG image digest}
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Generate a private random instance secret}
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: '8080'
      FORCE_OWNERSHIP: 'false'
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - search-cache:/var/cache/searxng
    networks:
      webui:
        aliases: [dai-search]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  webui:
    external: true
    name: ${OPENWEBUI_NETWORK:?Set the existing OpenWebUI Docker network name}
volumes:
  search-cache:
